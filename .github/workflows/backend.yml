name: Deploy Backend to EC2

on:
  push:
    branches: [main]
  workflow_dispatch: # manual trigger

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.13.1"
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build TypeScript
        run: bun run build --filter=@dtc/backend
        env:
          NODE_ENV: production

      - name: Create deployment package (without node_modules)
        run: |
          mkdir -p deploy
          cp -r apps/backend/.medusa deploy/
          tar -czf deploy.tar.gz -C deploy .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: deploy.tar.gz
          retention-days: 1

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      - name: Deploy to EC2 via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          scp -i ~/.ssh/deploy_key \
            deploy.tar.gz "${EC2_USER}@${EC2_HOST}:/tmp/deploy.tar.gz"

          ssh -i ~/.ssh/deploy_key "${EC2_USER}@${EC2_HOST}" "
            set -e
            APP_DIR=/home/${EC2_USER}/store1
            mkdir -p \"\$APP_DIR\"

            echo 'Fixing directory ownership...'
            sudo chown -R \$USER:\$USER \"\$APP_DIR\"

            cd \"\$APP_DIR\"

            if [ -d dist ]; then
              timestamp=\$(date +%Y%m%d_%H%M%S)
              mkdir -p backups
              tar -czf backups/backup_\${timestamp}.tar.gz dist package.json ecosystem.config.cjs .env 2>/dev/null || true
              ls -t backups/backup_*.tar.gz 2>/dev/null | tail -n +6 | xargs -r rm
            fi

            echo 'Extracting new deployment package...'
            tar --overwrite -xzf /tmp/deploy.tar.gz -C \"\$APP_DIR\"
            rm /tmp/deploy.tar.gz

            sudo chown -R \$USER:\$USER \"\$APP_DIR\"

            cd .medusa/server

            cp ~/.env.production .
            
            echo 'Installing production dependencies...'
            bun install --frozen-lockfile

            if [ ! -f .env ]; then
              echo 'Creating default .env file...'
              echo 'NODE_ENV=production' > .env
            fi

            echo 'Starting application with PM2...'
            if pm2 describe store-admin > /dev/null 2>&1; then
              pm2 restart store-admin --update-env
            else
              pm2 start bun --name store-admin -- run start
            fi
            pm2 save
          "